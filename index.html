<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TideStack Forge</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.5rem, 7vw, 5rem);
        line-height: 1;
      }

      p {
        margin: 0;
        max-width: 560px;
        color: #cbd5e1;
        font-size: 1.125rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TideStack Forge</h1>
      <p>Organization website for TideStack Forge.</p>
    </main>
  </body>
</html>
